services:
  mt5-vantage-demo:
    image: zenith-mt5-bridge:latest
    container_name: zenith-mt5-vantage-demo
    privileged: true
    security_opt:
      - seccomp:unconfined
    environment:
      - MT5_LOGIN=25566816
      - MT5_PASSWORD=Z@6uZJsF
      - MT5_SERVER=VantageMarkets-Demo
      - ZENITH_API_URL=http://host.docker.internal:4000
      - ZENITH_API_KEY=e81707bb-2524-476e-9e86-062375a303fe
      - POLL_INTERVAL=30
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - mt5_wine:/root/.wine
      - ./entrypoint.sh:/app/entrypoint.sh:ro
      - ./bridge.py:/app/bridge.py:ro
      - ./bridge_mock.py:/app/bridge_mock.py:ro
    restart: unless-stopped
    mem_limit: 1g
    shm_size: "512m"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mt5_wine:
    name: zenith_mt5_wine

networks:
  default:
    name: zenith_default
    external: true
