# ZENITH — full stack. `./deploy.sh` or `docker compose up -d --build`.
# Configure via .env (see .env.example).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zenith}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zenith}
      POSTGRES_DB: ${POSTGRES_DB:-zenith}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-zenith}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-zenith}:${POSTGRES_PASSWORD:-zenith}@postgres:5432/${POSTGRES_DB:-zenith}
      REDIS_URL: redis://redis:6379
      PORT: 4000
      CORS_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_LIFETIME: ${STRIPE_PRICE_LIFETIME:-}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      # Demo mode (no Clerk keys): every request acts as this user.
      AUTH_DEV_USER: ${AUTH_DEV_USER:-}
      # Local JWT auth (self-hosted, no Clerk).
      LOCAL_JWT_SECRET: ${LOCAL_JWT_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:-${LOCAL_JWT_SECRET:-}}
    volumes:
      - uploads:/repo/apps/api/uploads
    ports:
      - '${API_PORT:-4000}:4000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/v1}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      INTERNAL_API_URL: http://api:4000
    ports:
      - '${WEB_PORT:-3000}:3000'

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /v1
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_INTERNAL_URL: http://api:4000
    ports:
      - "3001:3001"

volumes:
  pgdata:
  redisdata:
  uploads:
